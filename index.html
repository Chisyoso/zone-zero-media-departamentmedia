<!-- groups.html -->

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>Groups Generator</title>

<link rel="stylesheet" href="css/main.css">

<style>

.groups-panel{
display:flex;
flex-direction:column;
gap:14px;
}

.group-box{
padding:14px;
border-radius:16px;
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.06);
display:flex;
flex-direction:column;
gap:10px;
}

.group-title{
font-size:15px;
font-weight:bold;
letter-spacing:1px;
}

.team-row{
display:grid;
grid-template-columns:1fr 130px;
gap:8px;
}

.layout-panel{
margin-top:10px;
padding:14px;
border-radius:16px;
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.06);
display:flex;
flex-direction:column;
gap:10px;
}

.layout-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.layout-grid button{
padding:14px;
border:none;
border-radius:14px;
background:linear-gradient(
180deg,
#5f5fff,
#3a3aff
);
color:white;
font-weight:bold;
cursor:pointer;
}

.layout-inputs{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.layout-inputs input{
width:100%;
}

</style>

</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

<div class="logo">
<h1>ZONE ZERO</h1>
<span>GROUPS</span>
</div>

<button
class="toggle-close"
onclick="toggleSidebar()"
>
✕
</button>

<button
class="back-btn"
onclick="location.href='index.html'"
>
← Back
</button>

<div class="section groups-panel">

<h3>Groups Generator</h3>

<label>Background URL</label>

<input
id="bg"
placeholder="Imgur URL"
value="https://i.imgur.com/Z72kUog.png"
/>

<label>Side Text</label>

<input
id="sideText"
value="EU"
/>

<label>Groups</label>

<input
id="groupCount"
type="number"
min="1"
max="20"
value="8"
/>

<label>Teams Per Group</label>

<input
id="teamsPerGroup"
type="number"
min="1"
max="20"
value="5"
/>

<div id="groupsContainer"></div>

<div class="layout-panel">

<div class="group-title">
Layout Controls
</div>

<div class="layout-grid">

<button onclick="toggleLayout()">
Toggle Layout
</button>

<button onclick="resetLayout()">
Reset Layout
</button>

<button onclick="addGroup()">
Add Group
</button>

<button onclick="removeGroup()">
Remove Group
</button>

</div>

<div class="layout-inputs">

<input
id="boxWidth"
type="number"
placeholder="Box Width"
value="286"
/>

<input
id="boxHeight"
type="number"
placeholder="Box Height"
value="274"
/>

<input
id="teamHeight"
type="number"
placeholder="Team Height"
value="42"
/>

<input
id="gapX"
type="number"
placeholder="Gap X"
value="24"
/>

<input
id="gapY"
type="number"
placeholder="Gap Y"
value="28"
/>

<input
id="groupsPerRow"
type="number"
placeholder="Groups Per Row"
value="4"
/>

</div>

</div>

</div>

<div class="actions">

<button onclick="saveLocal()">
Save Local
</button>

<button onclick="downloadTXT()">
Save TXT
</button>

<button onclick="loadTXT()">
Load TXT
</button>

<button onclick="downloadImage()">
Save Photo
</button>

</div>

</aside>

<main class="main">

<div class="topbar">

<button
class="mobile-open"
onclick="toggleSidebar()"
>
☰
</button>

<h2>Groups Generator</h2>

</div>

<section class="editor">

<canvas
id="canvas"
width="1536"
height="864"
></canvas>

</section>

</main>

</div>

<input
type="file"
id="txtLoader"
hidden
accept=".txt,.json"
/>

<script src="js/groups.js"></script>

</body>
</html>
