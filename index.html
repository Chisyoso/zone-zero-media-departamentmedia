<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zone Zero Media</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>

<div class="app">

<aside class="sidebar" id="sidebar">

<div class="logo">
<h1>ZONE ZERO</h1>
<span>MEDIA</span>
</div>

<button class="toggle-close" onclick="toggleSidebar()">✕</button>

<button class="back-btn">← Index</button>

<div class="section">

<h3>5V5 Generator</h3>

<label>Background URL</label>
<input id="stadium" placeholder="Imgur background URL">

<div id="players"></div>
<!-- AÑADE ESTO DEBAJO DE <div id="players"></div> -->

<div id="pvpPanel" class="pvp-panel hidden">

<h3 class="pvp-title">TEAM PVP</h3>

<div class="pvp-grid">

<div class="pvp-side">

<label>Nick 1</label>
<input list="nicklist" id="pvp_nick1" placeholder="Username">

<label>Name 1</label>
<input id="pvp_name1" placeholder="Display Name">

<label>Color 1</label>
<input type="color" id="pvp_color1" value="#ff004c">

</div>

<div class="pvp-side">

<label>Nick 2</label>
<input list="nicklist" id="pvp_nick2" placeholder="Username">

<label>Name 2</label>
<input id="pvp_name2" placeholder="Display Name">

<label>Color 2</label>
<input type="color" id="pvp_color2" value="#00d9ff">

</div>

</div>

<label>Score</label>
<input id="pvp_score" placeholder="0-0">

<label>Background URL</label>
<input id="pvp_bg" placeholder="Background image URL">

<div class="actions">
<button onclick="reloadPvpAvatars()">
Reload Avatars
</button>
</div>

</div>

</div>

<div class="actions">
<button onclick="saveLocal()">Save Local</button>
<button onclick="downloadTXT()">Save TXT</button>
<button onclick="loadTXT()">Load TXT</button>
<button onclick="downloadImage()">Save Photo</button>
<button onclick="reloadAvatars()">Reload Avatars</button>
</div>

</aside>

<main class="main">

<div class="topbar">
<button class="mobile-open" onclick="toggleSidebar()">☰</button>
<h2>Image Editor</h2>
</div>

<section class="cards">

<div class="card active">
<h3>5V5 Formation</h3>
<p>Main generator ready</p>
</div>
<div class="card" onclick="switchMode('pvp')">
<h3>Team PVP</h3>
<p>Versus generator</p>
</div>

<div class="card disabled">
<h3>Player Cards</h3>
<p>Coming soon</p>
</div>

<div class="card disabled">
<h3>Profile Creator</h3>
<p>Coming soon</p>
</div>

<div class="card disabled">
<h3>Overlay Maker</h3>
<p>Coming soon</p>
</div>

</section>

<section class="editor">
<canvas id="canvas" width="1600" height="1000"></canvas>
</section>

</main>

</div>

<input type="file" id="txtLoader" hidden accept=".txt,.json">

<script src="js/app.js"></script>
<!-- AÑADE ESTO DEBAJO DE app.js -->

<script src="js/pvp.js"></script>
</body>
</html>
