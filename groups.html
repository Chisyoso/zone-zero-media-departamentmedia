<!-- groups.html COMPLETO -->

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0"
>

<title>Groups Generator</title>

<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/mobile.css">

<style>

.group-box{
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.07);
border-radius:16px;
padding:12px;
display:flex;
flex-direction:column;
gap:10px;
margin-bottom:14px;
}

.group-top{
display:flex;
justify-content:space-between;
align-items:center;
}

.group-title{
font-size:14px;
font-weight:bold;
opacity:.85;
}

.group-remove{
width:34px;
height:34px;
border:none;
border-radius:10px;
background:#ff4c4c;
color:white;
cursor:pointer;
font-weight:bold;
}

.team-item{
display:flex;
gap:8px;
}

.team-item input{
flex:1;
}

.layout-box{
margin-top:14px;
padding:14px;
border-radius:16px;
background:rgba(255,255,255,.04);
display:flex;
flex-direction:column;
gap:10px;
}

.layout-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.check-line{
display:flex;
align-items:center;
gap:8px;
font-size:13px;
}

.range{
width:100%;
}

.groups-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:14px;
}

.groups-actions button,
.add-group-btn{
padding:14px;
border:none;
border-radius:14px;
background:linear-gradient(180deg,#5f5fff,#3a3aff);
color:white;
font-weight:bold;
cursor:pointer;
}

.add-group-btn{
width:100%;
margin-top:14px;
}

</style>

</head>

<body>

<div class="app">

<aside
class="sidebar"
id="sidebar"
>

<div class="logo">

<h1>ZONE ZERO</h1>

<span>GROUPS</span>

</div>

<button
class="toggle-close"
onclick="toggleSidebar()"
>
✕
</button>

<button
class="back-btn"
onclick="location.href='index.html'"
>
← Back
</button>

<div class="section">

<h3>Groups Generator</h3>

<label>Background URL</label>

<input
id="bgUrl"
placeholder="Imgur URL"
value="https://i.imgur.com/Z72kUog.png"
>

<label>Global Color</label>

<input
type="color"
id="globalColor"
value="#6f8cff"
>

<div class="check-line">

<input
type="checkbox"
id="useGlobalColor"
checked
>

<span>
Use same color for all
</span>

</div>

<div class="check-line">

<input
type="checkbox"
id="showBorders"
checked
>

<span>
Show borders
</span>

</div>

<div class="check-line">

<input
type="checkbox"
id="moveAll"
>

<span>
Move all blocks together
</span>

</div>

<div class="layout-box">

<b>Layout</b>

<div class="layout-grid">

<div>

<label>Gap X</label>

<input
class="range"
type="range"
id="gapX"
min="0"
max="140"
value="35"
>

</div>

<div>

<label>Gap Y</label>

<input
class="range"
type="range"
id="gapY"
min="0"
max="140"
value="28"
>

</div>

</div>

</div>

<div id="groupsContainer"></div>

<button
class="add-group-btn"
onclick="addGroup()"
>
+ Add Group
</button>

<div class="groups-actions">

<button onclick="saveLocal()">
Save
</button>

<button onclick="downloadImage()">
PNG
</button>

<button onclick="saveTXT()">
TXT
</button>

<button onclick="loadTXT()">
Load
</button>

<button onclick="toggleLayoutMode()">
Layout
</button>

<button onclick="resetLayout()">
Reset
</button>

</div>

</div>

</aside>

<main class="main">

<div class="topbar">

<button
class="mobile-open"
onclick="toggleSidebar()"
>
☰
</button>

<h2>Groups Editor</h2>

</div>

<section class="editor">

<canvas
id="canvas"
width="1600"
height="900"
></canvas>

</section>

</main>

</div>

<input
type="file"
id="txtLoader"
hidden
accept=".txt,.json"
>

<script src="js/groups.js"></script>

</body>

</html>
