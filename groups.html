<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Groups Generator</title>

<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/mobile.css">

<style>

.group-box{
padding:14px;
border-radius:18px;
background:rgba(255,255,255,.04);
margin-bottom:18px;
display:flex;
flex-direction:column;
gap:10px;
border:1px solid rgba(255,255,255,.08);
}

.group-top{
display:flex;
align-items:center;
justify-content:space-between;
}

.group-title{
font-size:15px;
font-weight:bold;
}

.group-remove{
width:34px;
height:34px;
border:none;
border-radius:10px;
background:#ff4d4d;
color:white;
cursor:pointer;
}

.team-item{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.check-line{
display:flex;
align-items:center;
gap:8px;
margin-top:6px;
}

.check-line input{
width:auto;
}

</style>

</head>
<body>

<div class="app">

<aside
class="sidebar"
id="sidebar"
>

<div class="logo">

<h1>ZONE ZERO</h1>

<span>MEDIA</span>

</div>

<button
class="toggle-close"
onclick="toggleSidebar()"
>
✕
</button>

<div class="section">

<h3>Groups Generator</h3>

<label>Background URL</label>

<input
id="bgUrl"
placeholder="Imgur URL"
value="https://i.imgur.com/Z72kUog.png"
>

<label>Global Color</label>

<input
type="color"
id="globalColor"
value="#6f8cff"
>

<label class="check-line">

<input
type="checkbox"
id="useGlobalColor"
checked
>

<span>
Use Global Color
</span>

</label>

<label class="check-line">

<input
type="checkbox"
id="showBorders"
checked
>

<span>
Show Borders
</span>

</label>

<label class="check-line">

<input
type="checkbox"
id="minimalBorders"
>

<span>
Minimal Borders
</span>

</label>

<label class="check-line">

<input
type="checkbox"
id="moveAll"
>

<span>
Move All Groups
</span>

</label>

<label>Horizontal Gap</label>

<input
type="range"
id="gapX"
min="0"
max="200"
value="35"
>

<label>Vertical Gap</label>

<input
type="range"
id="gapY"
min="0"
max="200"
value="28"
>

<div
class="actions"
style="margin-top:18px;"
>

<button onclick="addGroup()">
Add Block
</button>

<button onclick="toggleLayoutMode()">
Layout
</button>

<button onclick="resetLayout()">
Reset
</button>

<button onclick="saveLocal()">
Save
</button>

<button onclick="saveTXT()">
TXT
</button>

<button onclick="loadTXT()">
Load
</button>

<button onclick="downloadImage()">
PNG
</button>

</div>

<div
id="groupsContainer"
style="margin-top:18px;"
></div>

</div>

</aside>

<main class="main">

<div class="topbar">

<button
class="mobile-open"
onclick="toggleSidebar()"
>
☰
</button>

<h2>
Groups Editor
</h2>

</div>

<section class="editor">

<canvas
id="canvas"
></canvas>

</section>

</main>

</div>

<input
type="file"
id="txtLoader"
hidden
accept=".txt,.json"
>

<script src="js/groups.js"></script>

</body>
</html>
